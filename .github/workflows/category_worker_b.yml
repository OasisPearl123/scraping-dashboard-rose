name: TikTok Multi-Province Scraper (Group B)

on:
  schedule:
    - cron: '15 */2 * * *' # Every 2 hours (offset by 15 mins)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        province: ['Kalimantan Barat', 'Kalimantan Tengah', 'Kalimantan Selatan', 'Kalimantan Timur', 'Kalimantan Utara', 'Sulawesi Utara', 'Gorontalo', 'Sulawesi Tengah', 'Sulawesi Barat', 'Sulawesi Selatan', 'Sulawesi Tenggara', 'Maluku', 'Maluku Utara', 'Papua', 'Papua Barat', 'Papua Selatan', 'Papua Tengah', 'Papua Pegunungan', 'Papua Barat Daya']
    
    name: ${{ matrix.province }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r scraper/requirements.txt
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Run Scraper Engine
        env:
          PYTHONUNBUFFERED: "1"
          TARGET_PROVINCE: ${{ matrix.province }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          PASSWORD_SUPABASE: ${{ secrets.PASSWORD_SUPABASE }}
          WA_API_URL: ${{ secrets.WA_API_URL }}
          WA_INSTANCE_ID: ${{ secrets.WA_INSTANCE_ID }}
          WA_API_TOKEN: ${{ secrets.WA_API_TOKEN }}
          WA_GROUP_ID: ${{ secrets.WA_GROUP_ID }}
        run: python scraper/engine.py
