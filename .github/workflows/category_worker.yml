name: TikTok Category Worker (Triple Multi-Engine)

on:
  schedule:
    - cron: '0 */3 * * *' # Runs every 3 hours for maximum speed
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker_id: [1, 2, 3] # Spawns 3 separate workers
    
    name: Worker ${{ matrix.worker_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r scraper/requirements.txt
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Run Scraper Engine
        env:
          PYTHONUNBUFFERED: "1"
          WORKER_ID: ${{ matrix.worker_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          PASSWORD_SUPABASE: ${{ secrets.PASSWORD_SUPABASE }}
          WA_API_URL: ${{ secrets.WA_API_URL }}
          WA_INSTANCE_ID: ${{ secrets.WA_INSTANCE_ID }}
          WA_API_TOKEN: ${{ secrets.WA_API_TOKEN }}
          WA_GROUP_ID: ${{ secrets.WA_GROUP_ID }}
        run: python scraper/engine.py
